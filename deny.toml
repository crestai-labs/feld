# `cargo deny check advisories licenses`, which the Release workflow runs before it builds.
# It covers the crates the released binaries link, the same set `about.toml` lists.
[graph]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
exclude-dev = true

# A crate with a vulnerability reported in the RustSec advisory database stops the release.
[advisories]

# The licenses are the `accepted` of `about.toml`.
[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
]

# Feld itself is not third-party software.
[licenses.private]
ignore = true
