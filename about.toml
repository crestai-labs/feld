# The licenses a crate the released binaries link may carry. `cargo about generate` stops
# at a crate under any other, so taking on a new license is a decision.
accepted = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
ignore-dev-dependencies = true
ignore-build-dependencies = true

# Feld itself is not third-party software.
private = { ignore = true }
