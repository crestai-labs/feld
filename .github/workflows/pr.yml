# The checks that need no Runtime. A PR runs the DCO sign-off check, `cargo deny`, `npm audit`,
# fmt, and clippy; the weekly run checks the advisories again, which may appear for dependencies that stay the same.
# A manual run does what a PR does, except the DCO check.
name: PR

on:
  pull_request:
  schedule:
    # Monday, 00:00 UTC.
    - cron: "0 0 * * 1"
  workflow_dispatch:

# A newer push to a PR supersedes the run of the one before it.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_DENY_VERSION: 0.20.2

jobs:
  # Every commit of the PR, except merge commits, carries a `Signed-off-by` trailer with its
  # author's email.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email=$(git log -1 --format='%ae' "$commit")
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$commit" \
              | sed -n 's/^[^<>]*<\([^<>]*\)>[[:space:]]*$/\1/p' \
              | grep -ixF -- "$email" >/dev/null; then
              echo "::error::$(git log -1 --format='%h %s' "$commit"): no Signed-off-by for <$email>"
              missing=1
            fi
          done
          exit "$missing"

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-deny-cache
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ env.CARGO_DENY_VERSION }}-ubuntu-24.04
      - name: Install cargo-deny
        if: steps.cargo-deny-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"
      - run: cargo deny check advisories licenses
        if: github.event_name != 'schedule'
      - run: cargo deny check advisories
        if: github.event_name == 'schedule'
      - run: npm --prefix web audit

  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
